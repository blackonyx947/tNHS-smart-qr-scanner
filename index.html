<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<title>TNHS Smart QR Gate Scanner</title>


<!-- QR SCANNER LIBRARY -->

<script
  src="https://unpkg.com/html5-qrcode"
  type="text/javascript">
</script>


<style>

* {
  box-sizing: border-box;
}


body {

  margin: 0;

  min-height: 100vh;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #e8f5e9,
      #dcedc8,
      #ffffff
    );

  display: flex;

  justify-content: center;

  align-items: center;

  padding: 15px;

}


.container {

  width: 100%;

  max-width: 480px;

  background: white;

  border-radius: 22px;

  box-shadow:
    0 8px 30px rgba(
      0,
      0,
      0,
      0.18
    );

  padding: 20px;

  text-align: center;

}


.school-title {

  font-size: 23px;

  font-weight: bold;

  color: #176b35;

  margin-bottom: 3px;

}


.system-title {

  font-size: 16px;

  color: #555;

  margin-bottom: 18px;

}


/* MODE BUTTONS */

.mode-container {

  display: flex;

  gap: 10px;

  margin-bottom: 15px;

}


.mode-btn {

  flex: 1;

  padding: 13px;

  border: none;

  border-radius: 12px;

  font-size: 17px;

  font-weight: bold;

  cursor: pointer;

}


.entry-btn {

  background: #d9f2df;

  color: #176b35;

}


.exit-btn {

  background: #e6e6e6;

  color: #444;

}


.entry-btn.active {

  background: #198754;

  color: white;

}


.exit-btn.active {

  background: #555;

  color: white;

}


/* SCANNER */

#reader {

  width: 100%;

  overflow: hidden;

  border-radius: 15px;

  background: #111;

}


.scan-instruction {

  margin-top: 12px;

  color: #555;

  font-size: 14px;

}


/* RESULT */

#result {

  display: none;

}


.status {

  font-size: 23px;

  font-weight: bold;

  padding: 15px;

  border-radius: 12px;

  margin-bottom: 15px;

}


.status.valid {

  background: #d9f2df;

  color: #176b35;

}


.status.invalid {

  background: #f8d7da;

  color: #842029;

}


.status.duplicate {

  background: #fff3cd;

  color: #664d03;

}


/* STUDENT INFORMATION */

.student-card {

  background: #f8f9fa;

  border-radius: 15px;

  padding: 18px;

  margin-bottom: 15px;

}


.student-name {

  font-size: 24px;

  font-weight: bold;

  color: #176b35;

  margin-bottom: 10px;

}


.student-info {

  text-align: left;

  font-size: 17px;

  line-height: 1.7;

}


.student-info strong {

  color: #555;

}


/* REMARK */

.remark {

  padding: 14px;

  border-radius: 10px;

  font-size: 21px;

  font-weight: bold;

  margin-top: 15px;

}


.remark.ontime {

  background: #198754;

  color: white;

}


.remark.late {

  background: #dc3545;

  color: white;

}


.remark.gatepass {

  background: #dc3545;

  color: white;

}


.remark.normal {

  background: #198754;

  color: white;

}


/* SCAN NEXT */

#scanNextBtn {

  width: 100%;

  border: none;

  border-radius: 13px;

  padding: 16px;

  font-size: 19px;

  font-weight: bold;

  background: #176b35;

  color: white;

  cursor: pointer;

  margin-top: 10px;

}


#scanNextBtn:active {

  transform: scale(0.98);

}


/* LOADING */

#loading {

  display: none;

  font-size: 16px;

  color: #555;

  margin: 12px 0;

}


.error-text {

  color: #842029;

  font-size: 16px;

}


.footer {

  margin-top: 15px;

  color: #777;

  font-size: 12px;

}


</style>

</head>


<body>


<div class="container">


  <div class="school-title">

    TALAGA NATIONAL HIGH SCHOOL

  </div>


  <div class="system-title">

    Smart QR Gate Monitoring System

  </div>


  <!-- MODE -->

  <div class="mode-container">

    <button
      id="entryBtn"
      class="mode-btn entry-btn active"
      onclick="setMode('ENTRY')">

      ENTRY

    </button>


    <button
      id="exitBtn"
      class="mode-btn exit-btn"
      onclick="setMode('EXIT')">

      EXIT

    </button>

  </div>


  <!-- SCANNER -->

  <div id="scannerArea">

    <div id="reader"></div>

    <div class="scan-instruction">

      Scan the student's official QR code.

    </div>

  </div>


  <!-- LOADING -->

  <div id="loading">

    Verifying ID...

  </div>


  <!-- RESULT -->

  <div id="result">


    <div
      id="statusBox"
      class="status">

    </div>


    <div
      id="studentCard"
      class="student-card">


      <!-- PHOTO INTENTIONALLY OPTIONAL -->

      <div id="photoContainer"></div>


      <div
        id="studentName"
        class="student-name">

      </div>


      <div
        id="studentInfo"
        class="student-info">

      </div>


      <div
        id="remark"
        class="remark">

      </div>


    </div>


    <button
      id="scanNextBtn"
      onclick="scanNext()">

      SCAN NEXT

    </button>


  </div>


  <div class="footer">

    TNHS ICT Coordinator

  </div>


</div>



<script>


/* =====================================================
   CONFIGURATION
   ===================================================== */

const APPS_SCRIPT_URL =
  "https://script.google.com/a/macros/deped.gov.ph/s/AKfycbzdQ0ElSvuqPzLAFQ6cwACcoos_xECwXbh5uOXLqd1mAq3OpKmg5x1-FBpNzFoRa2JaFQ/exec";


let currentMode = "ENTRY";

let html5QrCode = null;

let scannerRunning = false;

let scanLocked = false;


/* =====================================================
   MODE
   ===================================================== */

function setMode(mode) {

  currentMode = mode;


  document
    .getElementById("entryBtn")
    .classList
    .toggle(
      "active",
      mode === "ENTRY"
    );


  document
    .getElementById("exitBtn")
    .classList
    .toggle(
      "active",
      mode === "EXIT"
    );

}


/* =====================================================
   START SCANNER
   ===================================================== */

async function startScanner() {

  scanLocked = false;


  document
    .getElementById("scannerArea")
    .style
    .display = "block";


  document
    .getElementById("result")
    .style
    .display = "none";


  document
    .getElementById("loading")
    .style
    .display = "none";


  if (html5QrCode) {

    try {

      if (scannerRunning) {

        await html5QrCode.stop();

      }

    } catch (e) {

      // Ignore stop errors.

    }

  }


  html5QrCode =
    new Html5Qrcode("reader");


  try {

    await html5QrCode.start(

      {
        facingMode: {
          ideal: "environment"
        }
      },

      {
        fps: 10,

        qrbox: function(
          viewfinderWidth,
          viewfinderHeight
        ) {

          const size =
            Math.min(
              viewfinderWidth,
              viewfinderHeight
            ) * 0.72;

          return {
            width: size,
            height: size
          };

        },

        aspectRatio: 1.0

      },

      onScanSuccess,

      onScanError

    );


    scannerRunning = true;

  } catch (error) {

    scannerRunning = false;


    document
      .getElementById("reader")
      .innerHTML =

      "<div style='padding:25px;color:white'>" +
      "Camera could not start.<br><br>" +
      "Please allow camera permission and reload the page." +
      "</div>";

  }

}


/* =====================================================
   SCAN ERROR
   ===================================================== */

function onScanError(errorMessage) {

  /*
   * QR scanner continuously produces
   * "not found" messages while searching.
   *
   * Do nothing here.
   */

}


/* =====================================================
   SUCCESSFUL QR SCAN
   ===================================================== */

async function onScanSuccess(decodedText) {

  if (scanLocked) {
    return;
  }


  scanLocked = true;


  const studentId =
    extractStudentId(decodedText);


  if (!studentId) {

    await stopScanner();

    showInvalid(
      "INVALID ID - No records found!"
    );

    return;

  }


  await stopScanner();


  document
    .getElementById("scannerArea")
    .style
    .display = "none";


  document
    .getElementById("loading")
    .style
    .display = "block";


  /*
   * Call Apps Script API
   */

  callScanAPI(
    studentId,
    currentMode
  );

}


/* =====================================================
   EXTRACT STUDENT ID
   ===================================================== */

function extractStudentId(text) {

  const value =
    String(text || '').trim();


  /*
   * Direct Student ID
   */

  if (
    /^TNHS-[A-Z0-9_-]+$/i.test(value)
  ) {

    return value;

  }


  /*
   * If QR contains a URL with
   * studentId parameter
   */

  try {

    const url =
      new URL(value);


    const id =
      url.searchParams.get(
        "studentId"
      );


    if (id) {

      return id.trim();

    }

  } catch (e) {

    // Not a URL.

  }


  /*
   * Search text for TNHS-xxxx
   */

  const match =
    value.match(
      /TNHS-[A-Z0-9_-]+/i
    );


  if (match) {

    return match[0];

  }


  return "";

}


/* =====================================================
   STOP SCANNER
   ===================================================== */

async function stopScanner() {

  if (
    html5QrCode &&
    scannerRunning
  ) {

    try {

      await html5QrCode.stop();

      scannerRunning = false;

    } catch (e) {

      scannerRunning = false;

    }

  }

}


/* =====================================================
   CALL APPS SCRIPT
   ===================================================== */

function callScanAPI(
  studentId,
  mode
) {

  const callbackName =
    "tnhsCallback_" +
    Date.now();


  const script =
    document.createElement("script");


  const timeout =
    setTimeout(
      function() {

        cleanup();

        document
          .getElementById("loading")
          .style
          .display = "none";


        showInvalid(
          "System response timed out. Please try again."
        );

      },
      15000
    );


  window[callbackName] =
    function(data) {

      clearTimeout(timeout);

      cleanup();


      document
        .getElementById("loading")
        .style
        .display = "none";


      processResult(data);

    };


  function cleanup() {

    try {

      script.remove();

    } catch (e) {}


    try {

      delete window[callbackName];

    } catch (e) {}

  }


  const url =
    APPS_SCRIPT_URL +
    "?api=scan" +
    "&studentId=" +
    encodeURIComponent(studentId) +
    "&mode=" +
    encodeURIComponent(mode) +
    "&callback=" +
    encodeURIComponent(callbackName) +
    "&_=" +
    Date.now();


  script.src = url;

  script.async = true;


  script.onerror =
    function() {

      clearTimeout(timeout);

      cleanup();


      document
        .getElementById("loading")
        .style
        .display = "none";


      showInvalid(
        "Unable to connect to the gate server."
      );

    };


  document
    .body
    .appendChild(script);

}


/* =====================================================
   PROCESS RESULT
   ===================================================== */

function processResult(data) {

  if (!data) {

    showInvalid(
      "No response received."
    );

    return;

  }


  if (!data.ok) {

    showInvalid(
      data.message ||
      "INVALID ID - No records found!"
    );

    return;

  }


  showStudentResult(data);

}


/* =====================================================
   SHOW VALID STUDENT
   ===================================================== */

function showStudentResult(data) {

  const student =
    data.student || {};


  const statusBox =
    document.getElementById(
      "statusBox"
    );


  const studentCard =
    document.getElementById(
      "studentCard"
    );


  const name =
    document.getElementById(
      "studentName"
    );


  const info =
    document.getElementById(
      "studentInfo"
    );


  const remark =
    document.getElementById(
      "remark"
    );


  const photoContainer =
    document.getElementById(
      "photoContainer"
    );


  /* STATUS */

  if (
    data.type === "duplicate" ||
    data.gateStatus === "ALREADY SCANNED"
  ) {

    statusBox.className =
      "status duplicate";

    statusBox.textContent =
      "ALREADY SCANNED";

  } else {

    statusBox.className =
      "status valid";

    statusBox.textContent =
      "VALID ID - Record Found";

  }


  /* NAME */

  name.textContent =
    student.name || "Student";


  /* INFORMATION */

  info.innerHTML =

    "<strong>LRN:</strong> " +
    escapeHtml(
      student.lrn || "-"
    ) +

    "<br>" +

    "<strong>Grade:</strong> " +
    escapeHtml(
      student.grade || "-"
    ) +

    "<br>" +

    "<strong>Section:</strong> " +
    escapeHtml(
      student.section || "-"
    );


  /*
   * PHOTO
   *
   * The backend currently intentionally
   * does not load Photo URL to keep scanning fast.
   *
   * Therefore no photo is required here.
   */

  photoContainer.innerHTML = "";


  /* REMARK */

  remark.textContent =
    data.remarks || "";


  remark.className =
    "remark " +
    getRemarkClass(
      data.remarks
    );


  /* SHOW */

  document
    .getElementById("result")
    .style
    .display = "block";


  document
    .getElementById("scannerArea")
    .style
    .display = "none";


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* =====================================================
   INVALID RESULT
   ===================================================== */

function showInvalid(message) {

  const statusBox =
    document.getElementById(
      "statusBox"
    );


  statusBox.className =
    "status invalid";


  statusBox.textContent =
    message;


  document
    .getElementById(
      "studentCard"
    )
    .style
    .display = "none";


  document
    .getElementById(
      "result"
    )
    .style
    .display = "block";


  document
    .getElementById(
      "scannerArea"
    )
    .style
    .display = "none";

}


/* =====================================================
   REMARK COLOR
   ===================================================== */

function getRemarkClass(
  remarks
) {

  const value =
    String(
      remarks || ''
    ).toUpperCase();


  if (
    value.includes("ON TIME")
  ) {

    return "ontime";

  }


  if (
    value.includes("LATE")
  ) {

    return "late";

  }


  if (
    value.includes("GATEPASS")
  ) {

    return "gatepass";

  }


  if (
    value.includes("NORMAL")
  ) {

    return "normal";

  }


  return "ontime";

}


/* =====================================================
   SCAN NEXT
   ===================================================== */

async function scanNext() {

  document
    .getElementById(
      "result"
    )
    .style
    .display = "none";


  document
    .getElementById(
      "studentCard"
    )
    .style
    .display = "block";


  document
    .getElementById(
      "loading"
    )
    .style
    .display = "none";


  document
    .getElementById(
      "statusBox"
    )
    .textContent = "";


  document
    .getElementById(
      "remark"
    )
    .textContent = "";


  document
    .getElementById(
      "photoContainer"
    )
    .innerHTML = "";


  scanLocked = false;


  await startScanner();

}


/* =====================================================
   HTML ESCAPE
   ===================================================== */

function escapeHtml(value) {

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================================
   START
   ===================================================== */

window.addEventListener(
  "load",
  function() {

    startScanner();

  }
);


</script>


</body>

</html>
