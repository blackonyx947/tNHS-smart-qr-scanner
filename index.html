<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>TNHS Smart QR Gate Scanner</title>

<script
  src="https://unpkg.com/html5-qrcode"
  type="text/javascript">
</script>


<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;

  font-family: Arial, Helvetica, sans-serif;

  background:
    linear-gradient(
      135deg,
      #e8f5e9,
      #dcedc8,
      #ffffff
    );

  display: flex;
  justify-content: center;
  align-items: center;

  padding: 12px;
}


.container {
  width: 100%;
  max-width: 480px;

  background: white;

  border-radius: 22px;

  box-shadow:
    0 8px 30px rgba(0,0,0,0.18);

  padding: 20px;

  text-align: center;
}


/* =====================================================
   HEADER
   ===================================================== */

.school-title {
  font-size: 22px;
  font-weight: bold;
  color: #176b35;
  margin-bottom: 4px;
}

.system-title {
  font-size: 16px;
  color: #555;
  margin-bottom: 18px;
}


/* =====================================================
   ENTRY / EXIT
   ===================================================== */

.mode-container {
  display: flex;
  gap: 10px;
  margin-bottom: 15px;
}

.mode-btn {
  flex: 1;

  padding: 14px;

  border: none;
  border-radius: 12px;

  font-size: 17px;
  font-weight: bold;

  cursor: pointer;
}

.entry-btn {
  background: #d9f2df;
  color: #176b35;
}

.exit-btn {
  background: #eeeeee;
  color: #444;
}

.entry-btn.active {
  background: #198754;
  color: white;
}

.exit-btn.active {
  background: #555555;
  color: white;
}


/* =====================================================
   CAMERA
   ===================================================== */

#scannerArea {
  display: block;
}

#reader {
  width: 100%;

  overflow: hidden;

  border-radius: 15px;

  background: #111;
}


/*
   This makes the camera video easier to see
   on small phones.
*/

#reader video {
  width: 100% !important;
  height: auto !important;

  border-radius: 15px;
}


.scan-instruction {
  margin-top: 12px;

  color: #555;

  font-size: 14px;
}


/* =====================================================
   CAMERA MESSAGE
   ===================================================== */

#cameraMessage {
  display: none;

  background: #fff3cd;

  border-radius: 15px;

  padding: 18px;

  margin-top: 12px;

  color: #664d03;

  font-size: 15px;

  line-height: 1.5;
}


#cameraButton {
  display: none;

  width: 100%;

  border: none;

  border-radius: 13px;

  padding: 16px;

  margin-top: 12px;

  font-size: 18px;

  font-weight: bold;

  background: #176b35;

  color: white;

  cursor: pointer;
}


/* =====================================================
   LOADING
   ===================================================== */

#loading {
  display: none;

  font-size: 17px;

  color: #555;

  padding: 15px;
}


/* =====================================================
   RESULT
   ===================================================== */

#result {
  display: none;
}


.status {
  font-size: 22px;

  font-weight: bold;

  padding: 15px;

  border-radius: 12px;

  margin-bottom: 15px;
}


.status.valid {
  background: #d9f2df;
  color: #176b35;
}


.status.invalid {
  background: #f8d7da;
  color: #842029;
}


.status.duplicate {
  background: #fff3cd;
  color: #664d03;
}


/* =====================================================
   STUDENT CARD
   ===================================================== */

.student-card {
  background: #f8f9fa;

  border-radius: 15px;

  padding: 18px;

  margin-bottom: 15px;
}


.student-name {
  font-size: 24px;

  font-weight: bold;

  color: #176b35;

  margin-bottom: 10px;
}


.student-info {
  text-align: left;

  font-size: 17px;

  line-height: 1.8;
}


.student-info strong {
  color: #555;
}


/* =====================================================
   REMARK
   ===================================================== */

.remark {
  padding: 14px;

  border-radius: 10px;

  font-size: 21px;

  font-weight: bold;

  margin-top: 15px;
}


.remark.ontime {
  background: #198754;
  color: white;
}


.remark.late {
  background: #dc3545;
  color: white;
}


.remark.gatepass {
  background: #dc3545;
  color: white;
}


.remark.normal {
  background: #198754;
  color: white;
}


/* =====================================================
   SCAN NEXT
   ===================================================== */

#scanNextBtn {
  width: 100%;

  border: none;

  border-radius: 13px;

  padding: 16px;

  font-size: 19px;

  font-weight: bold;

  background: #176b35;

  color: white;

  cursor: pointer;

  margin-top: 10px;
}


#scanNextBtn:active {
  transform: scale(0.98);
}


/* =====================================================
   FOOTER
   ===================================================== */

.footer {
  margin-top: 15px;

  color: #777;

  font-size: 12px;
}

</style>

</head>


<body>


<div class="container">


  <!-- =================================================
       HEADER
       ================================================= -->

  <div class="school-title">
    TALAGA NATIONAL HIGH SCHOOL
  </div>

  <div class="system-title">
    Smart QR Gate Monitoring System
  </div>


  <!-- =================================================
       ENTRY / EXIT
       ================================================= -->

  <div class="mode-container">

    <button
      id="entryBtn"
      class="mode-btn entry-btn active"
      onclick="setMode('ENTRY')">

      ENTRY

    </button>


    <button
      id="exitBtn"
      class="mode-btn exit-btn"
      onclick="setMode('EXIT')">

      EXIT

    </button>

  </div>


  <!-- =================================================
       CAMERA
       ================================================= -->

  <div id="scannerArea">

    <div id="reader"></div>

    <div class="scan-instruction">

      Point the camera at the student's QR code.

    </div>


    <div id="cameraMessage">

      <strong>Camera permission is required.</strong>

      <br><br>

      Tap the button below and choose
      <strong>Allow</strong> when Chrome asks
      for camera permission.

    </div>


    <button
      id="cameraButton"
      onclick="startCamera()">

      📷 START CAMERA

    </button>

  </div>


  <!-- =================================================
       LOADING
       ================================================= -->

  <div id="loading">
    Verifying ID...
  </div>


  <!-- =================================================
       RESULT
       ================================================= -->

  <div id="result">


    <div
      id="statusBox"
      class="status">
    </div>


    <div
      id="studentCard"
      class="student-card">


      <div
        id="studentName"
        class="student-name">
      </div>


      <div
        id="studentInfo"
        class="student-info">
      </div>


      <div
        id="remark"
        class="remark">
      </div>


    </div>


    <button
      id="scanNextBtn"
      onclick="scanNext()">

      SCAN NEXT

    </button>


  </div>


  <div class="footer">
    TNHS ICT Coordinator
  </div>


</div>



<script>


/* =====================================================
   APPS SCRIPT URL
   ===================================================== */

const APPS_SCRIPT_URL =
"https://script.google.com/a/macros/deped.gov.ph/s/AKfycbzdQ0ElSvuqPzLAFQ6cwACcoos_xECwXbh5uOXLqd1mAq3OpKmg5x1-FBpNzFoRa2JaFQ/exec";


/* =====================================================
   VARIABLES
   ===================================================== */

let currentMode = "ENTRY";

let html5QrCode = null;

let scannerRunning = false;

let scanLocked = false;


/* =====================================================
   MODE
   ===================================================== */

function setMode(mode) {

  currentMode = mode;


  document
    .getElementById("entryBtn")
    .classList
    .toggle(
      "active",
      mode === "ENTRY"
    );


  document
    .getElementById("exitBtn")
    .classList
    .toggle(
      "active",
      mode === "EXIT"
    );

}


/* =====================================================
   START CAMERA
   ===================================================== */

async function startCamera() {

  /*
   * Prevent multiple camera starts.
   */

  if (scannerRunning) {
    return;
  }


  /*
   * Reset screen.
   */

  scanLocked = false;


  document
    .getElementById("cameraMessage")
    .style
    .display = "none";


  document
    .getElementById("cameraButton")
    .style
    .display = "none";


  document
    .getElementById("result")
    .style
    .display = "none";


  document
    .getElementById("scannerArea")
    .style
    .display = "block";


  document
    .getElementById("loading")
    .style
    .display = "none";


  /*
   * Clear old scanner.
   */

  const reader =
    document.getElementById("reader");


  reader.innerHTML = "";


  /*
   * Create a NEW Html5Qrcode object.
   */

  html5QrCode =
    new Html5Qrcode("reader");


  try {

    /*
     * IMPORTANT:
     *
     * We let html5-qrcode itself request
     * camera permission.
     *
     * We do NOT call getUserMedia first.
     */

    await html5QrCode.start(

      {
        facingMode: "environment"
      },


      {
        fps: 10,

        qrbox: function(
          viewfinderWidth,
          viewfinderHeight
        ) {

          const size =
            Math.floor(
              Math.min(
                viewfinderWidth,
                viewfinderHeight
              ) * 0.72
            );


          return {
            width: size,
            height: size
          };

        },

        aspectRatio: 1.0

      },


      onScanSuccess,


      onScanError

    );


    /*
     * CAMERA SUCCESSFULLY STARTED
     */

    scannerRunning = true;


    document
      .getElementById("cameraMessage")
      .style
      .display = "none";


    document
      .getElementById("cameraButton")
      .style
      .display = "none";


  } catch (error) {

    /*
     * CAMERA FAILED
     */

    console.error(
      "Camera start error:",
      error
    );


    scannerRunning = false;


    showCameraError(
      error
    );

  }

}


/* =====================================================
   CAMERA ERROR
   ===================================================== */

function showCameraError(error) {

  document
    .getElementById("cameraMessage")
    .style
    .display = "block";


  document
    .getElementById("cameraButton")
    .style
    .display = "block";


  /*
   * Show a friendly message.
   */

  const message =
    document.getElementById(
      "cameraMessage"
    );


  if (
    error &&
    error.name === "NotAllowedError"
  ) {

    message.innerHTML =
      "<strong>Camera access was blocked.</strong>" +
      "<br><br>" +
      "Please tap START CAMERA and choose " +
      "<strong>Allow</strong>.";

  } else {

    message.innerHTML =
      "<strong>Camera could not start.</strong>" +
      "<br><br>" +
      "Please tap START CAMERA and allow camera access.";

  }

}


/* =====================================================
   QR SCAN ERROR
   ===================================================== */

function onScanError(errorMessage) {

  /*
   * Nothing needed.
   *
   * html5-qrcode continuously sends
   * scan errors while looking for QR codes.
   */

}


/* =====================================================
   QR SUCCESS
   ===================================================== */

async function onScanSuccess(
  decodedText
) {

  /*
   * Prevent multiple scans.
   */

  if (scanLocked) {
    return;
  }


  scanLocked = true;


  /*
   * Extract Student ID.
   */

  const studentId =
    extractStudentId(
      decodedText
    );


  /*
   * Invalid QR.
   */

  if (!studentId) {

    await stopScanner();


    showInvalid(
      "INVALID ID - No records found!"
    );


    return;

  }


  /*
   * Stop camera immediately.
   */

  await stopScanner();


  /*
   * Hide scanner.
   */

  document
    .getElementById("scannerArea")
    .style
    .display = "none";


  /*
   * Show loading.
   */

  document
    .getElementById("loading")
    .style
    .display = "block";


  /*
   * Send to Apps Script.
   */

  callScanAPI(
    studentId,
    currentMode
  );

}


/* =====================================================
   EXTRACT STUDENT ID
   ===================================================== */

function extractStudentId(text) {

  const value =
    String(
      text || ""
    ).trim();


  /*
   * Example:
   * TNHS-0001
   */

  if (
    /^TNHS-[A-Z0-9_-]+$/i.test(
      value
    )
  ) {

    return value;

  }


  /*
   * QR contains URL.
   */

  try {

    const url =
      new URL(value);


    const id =
      url.searchParams.get(
        "studentId"
      );


    if (id) {

      return id.trim();

    }

  } catch (error) {

    /*
     * Not a URL.
     */

  }


  /*
   * Search for TNHS ID
   * inside QR text.
   */

  const match =
    value.match(
      /TNHS-[A-Z0-9_-]+/i
    );


  if (match) {

    return match[0];

  }


  return "";

}


/* =====================================================
   STOP CAMERA
   ===================================================== */

async function stopScanner() {

  if (
    html5QrCode &&
    scannerRunning
  ) {

    try {

      await html5QrCode.stop();

    } catch (error) {

      console.log(
        "Camera stop:",
        error
      );

    }

  }


  scannerRunning = false;

}


/* =====================================================
   API CALL
   ===================================================== */

function callScanAPI(
  studentId,
  mode
) {


  /*
   * JSONP callback name.
   */

  const callbackName =
    "tnhsCallback_" +
    Date.now();


  const script =
    document.createElement(
      "script"
    );


  /*
   * Timeout
   */

  const timeout =
    setTimeout(
      function() {

        cleanup();


        document
          .getElementById("loading")
          .style
          .display = "none";


        showInvalid(
          "System response timed out. Please try again."
        );

      },
      15000
    );


  /*
   * Response callback.
   */

  window[callbackName] =
    function(data) {

      clearTimeout(
        timeout
      );


      cleanup();


      document
        .getElementById("loading")
        .style
        .display = "none";


      processResult(
        data
      );

    };


  /*
   * Cleanup.
   */

  function cleanup() {

    try {
      script.remove();
    } catch (error) {}


    try {
      delete window[callbackName];
    } catch (error) {}

  }


  /*
   * API URL
   */

  const url =
    APPS_SCRIPT_URL +

    "?api=scan" +

    "&studentId=" +
    encodeURIComponent(
      studentId
    ) +

    "&mode=" +
    encodeURIComponent(
      mode
    ) +

    "&callback=" +
    encodeURIComponent(
      callbackName
    ) +

    "&_=" +
    Date.now();


  script.src = url;

  script.async = true;


  /*
   * Connection error.
   */

  script.onerror =
    function() {

      clearTimeout(
        timeout
      );


      cleanup();


      document
        .getElementById("loading")
        .style
        .display = "none";


      showInvalid(
        "Unable to connect to the gate server."
      );

    };


  document
    .body
    .appendChild(
      script
    );

}


/* =====================================================
   PROCESS RESULT
   ===================================================== */

function processResult(data) {

  if (!data) {

    showInvalid(
      "No response received."
    );

    return;

  }


  if (!data.ok) {

    showInvalid(
      data.message ||
      "INVALID ID - No records found!"
    );

    return;

  }


  showStudentResult(
    data
  );

}


/* =====================================================
   SHOW STUDENT
   ===================================================== */

function showStudentResult(data) {

  const student =
    data.student || {};


  const statusBox =
    document.getElementById(
      "statusBox"
    );


  const studentCard =
    document.getElementById(
      "studentCard"
    );


  const studentName =
    document.getElementById(
      "studentName"
    );


  const studentInfo =
    document.getElementById(
      "studentInfo"
    );


  const remark =
    document.getElementById(
      "remark"
    );


  /*
   * STATUS
   */

  if (
    data.type === "duplicate" ||
    data.gateStatus === "ALREADY SCANNED"
  ) {

    statusBox.className =
      "status duplicate";

    statusBox.textContent =
      "ALREADY SCANNED";

  } else {

    statusBox.className =
      "status valid";

    statusBox.textContent =
      "VALID ID - Record Found";

  }


  /*
   * NAME
   */

  studentName.textContent =
    student.name ||
    (
      (student.firstName || "") +
      " " +
      (student.lastName || "")
    ).trim();


  /*
   * INFORMATION
   */

  studentInfo.innerHTML =

    "<strong>LRN:</strong> " +
    escapeHtml(
      student.lrn || "-"
    ) +

    "<br>" +

    "<strong>Grade:</strong> " +
    escapeHtml(
      student.grade || "-"
    ) +

    "<br>" +

    "<strong>Section:</strong> " +
    escapeHtml(
      student.section || "-"
    );


  /*
   * REMARK
   */

  remark.textContent =
    data.remarks || "";


  remark.className =
    "remark " +
    getRemarkClass(
      data.remarks
    );


  /*
   * SHOW RESULT
   */

  studentCard.style.display =
    "block";


  document
    .getElementById("result")
    .style
    .display = "block";


  document
    .getElementById("scannerArea")
    .style
    .display = "none";


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* =====================================================
   INVALID
   ===================================================== */

function showInvalid(message) {

  const statusBox =
    document.getElementById(
      "statusBox"
    );


  statusBox.className =
    "status invalid";


  statusBox.textContent =
    message;


  document
    .getElementById(
      "studentCard"
    )
    .style
    .display = "none";


  document
    .getElementById(
      "result"
    )
    .style
    .display = "block";


  document
    .getElementById(
      "scannerArea"
    )
    .style
    .display = "none";

}


/* =====================================================
   REMARK COLOR
   ===================================================== */

function getRemarkClass(
  remarks
) {

  const value =
    String(
      remarks || ""
    ).toUpperCase();


  if (
    value.includes("ON TIME")
  ) {
    return "ontime";
  }


  if (
    value.includes("LATE")
  ) {
    return "late";
  }


  if (
    value.includes("GATEPASS")
  ) {
    return "gatepass";
  }


  if (
    value.includes("NORMAL")
  ) {
    return "normal";
  }


  return "ontime";

}


/* =====================================================
   SCAN NEXT
   ===================================================== */

async function scanNext() {

  /*
   * Hide result.
   */

  document
    .getElementById("result")
    .style
    .display = "none";


  /*
   * Clear old information.
   */

  document
    .getElementById("studentName")
    .textContent = "";


  document
    .getElementById("studentInfo")
    .innerHTML = "";


  document
    .getElementById("remark")
    .textContent = "";


  /*
   * Reset.
   */

  scanLocked = false;


  /*
   * Start camera again.
   */

  await startCamera();

}


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHtml(value) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================================
   AUTOMATIC CAMERA LAUNCH
   ===================================================== */

window.addEventListener(
  "load",
  function() {

    /*
     * Give the page a very short moment
     * to finish loading the QR library,
     * then launch camera.
     */

    setTimeout(
      function() {

        startCamera();

      },
      500
    );

  }
);

</script>


</body>

</html>
