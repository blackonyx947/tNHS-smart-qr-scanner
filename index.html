<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>TNHS Smart QR Gate Scanner</title>


  <!-- QR SCANNER LIBRARY -->
  <script src="https://unpkg.com/html5-qrcode"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #eef7ff,
          #f8f5ff
        );

      color: #222;

      min-height: 100vh;
    }


    .container {

      width: 100%;

      max-width: 600px;

      margin: auto;

      padding: 15px;
    }


    .header {

      background:
        linear-gradient(
          135deg,
          #075985,
          #0f766e
        );

      color: white;

      padding: 18px;

      border-radius: 18px;

      text-align: center;

      margin-bottom: 15px;

      box-shadow:
        0 5px 15px
        rgba(0,0,0,0.15);
    }


    .header h1 {

      margin: 0;

      font-size: 24px;
    }


    .header p {

      margin: 5px 0 0;

      font-size: 14px;
    }


    .mode-buttons {

      display: flex;

      gap: 10px;

      margin-bottom: 15px;
    }


    .mode-buttons button {

      flex: 1;

      padding: 14px;

      border: none;

      border-radius: 12px;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;

      background: #dbeafe;

      color: #075985;
    }


    .mode-buttons button.active {

      background: #075985;

      color: white;
    }


    #reader {

      width: 100%;

      background: #000;

      border-radius: 18px;

      overflow: hidden;

      min-height: 300px;
    }


    .scanner-label {

      text-align: center;

      font-weight: bold;

      margin: 10px 0;

      color: #075985;
    }


    .result {

      display: none;

      background: white;

      border-radius: 18px;

      padding: 20px;

      margin-top: 15px;

      box-shadow:
        0 5px 20px
        rgba(0,0,0,0.12);

      text-align: center;
    }


    .status {

      padding: 14px;

      border-radius: 12px;

      font-size: 21px;

      font-weight: bold;

      margin-bottom: 15px;
    }


    .status.valid {

      background: #dcfce7;

      color: #166534;
    }


    .status.invalid {

      background: #fee2e2;

      color: #991b1b;
    }


    .status.warning {

      background: #fee2e2;

      color: #991b1b;
    }


    .student-info {

      text-align: left;

      margin-top: 10px;
    }


    .student-row {

      padding: 9px 0;

      border-bottom:
        1px solid #e5e7eb;

      font-size: 16px;
    }


    .student-row strong {

      display: inline-block;

      width: 105px;

      color: #475569;
    }


    .photo-box {

      width: 140px;

      height: 170px;

      margin: 0 auto 15px;

      border-radius: 12px;

      overflow: hidden;

      background: #f1f5f9;

      display: flex;

      align-items: center;

      justify-content: center;

      color: #64748b;

      font-size: 13px;
    }


    .photo-box img {

      width: 100%;

      height: 100%;

      object-fit: cover;

      display: block;
    }


    .remark {

      margin-top: 18px;

      padding: 16px;

      border-radius: 12px;

      font-size: 22px;

      font-weight: bold;
    }


    .remark.green {

      background: #16a34a;

      color: white;
    }


    .remark.red {

      background: #dc2626;

      color: white;
    }


    .remark.blue {

      background: #2563eb;

      color: white;
    }


    .scan-next {

      width: 100%;

      margin-top: 18px;

      padding: 16px;

      border: none;

      border-radius: 12px;

      background: #075985;

      color: white;

      font-size: 18px;

      font-weight: bold;

      cursor: pointer;
    }


    .scan-next:active {

      transform: scale(0.98);
    }


    .error-message {

      margin-top: 10px;

      color: #991b1b;

      text-align: center;

      font-size: 14px;
    }


    .loading {

      text-align: center;

      padding: 15px;

      color: #475569;

      display: none;
    }

  </style>

</head>


<body>

  <div class="container">


    <div class="header">

      <h1>
        TNHS SMART QR GATE SCANNER
      </h1>

      <p>
        Talaga National High School
      </p>

    </div>


    <!-- ENTRY / EXIT -->

    <div class="mode-buttons">

      <button
        id="entryBtn"
        class="active"
        onclick="setMode('ENTRY')"
      >
        ENTRY
      </button>

      <button
        id="exitBtn"
        onclick="setMode('EXIT')"
      >
        EXIT
      </button>

    </div>


    <div
      id="scannerArea"
    >

      <div class="scanner-label">
        Scan Student QR Code
      </div>

      <div id="reader"></div>

      <div
        id="errorMessage"
        class="error-message"
      ></div>

    </div>


    <div
      id="loading"
      class="loading"
    >
      Checking student record...
    </div>


    <!-- RESULT -->

    <div
      id="result"
      class="result"
    >

      <div
        id="status"
        class="status valid"
      >
        VALID ID - Record Found
      </div>


      <!-- PHOTO OPTIONAL -->

      <div
        id="photoBox"
        class="photo-box"
      >
        Photo unavailable
      </div>


      <div class="student-info">

        <div class="student-row">

          <strong>Name:</strong>

          <span id="studentName"></span>

        </div>


        <div class="student-row">

          <strong>Grade:</strong>

          <span id="studentGrade"></span>

        </div>


        <div class="student-row">

          <strong>Section:</strong>

          <span id="studentSection"></span>

        </div>


        <div class="student-row">

          <strong>LRN:</strong>

          <span id="studentLRN"></span>

        </div>


        <div class="student-row">

          <strong>Student ID:</strong>

          <span id="studentId"></span>

        </div>

      </div>


      <div
        id="remark"
        class="remark green"
      ></div>


      <button
        class="scan-next"
        onclick="scanNext()"
      >
        SCAN NEXT
      </button>

    </div>

  </div>


<script>

/*******************************************************
 * YOUR APPS SCRIPT WEB APP URL
 *******************************************************/
const APPS_SCRIPT_URL =
  'https://script.google.com/a/macros/deped.gov.ph/s/AKfycbzdQ0ElSvuqPzLAFQ6cwACcoos_xECwXbh5uOXLqd1mAq3OpKmg5x1-FBpNzFoRa2JaFQ/exec';


/*
 * IMPORTANT:
 * Make sure this URL is exactly the same
 * as your deployed Apps Script Web App URL.
 */


/*******************************************************
 * VARIABLES
 *******************************************************/
let currentMode = 'ENTRY';

let scanner = null;

let scannerRunning = false;

let processingScan = false;


/*******************************************************
 * PAGE LOAD
 *******************************************************/
window.onload = function() {

  startScanner();

};


/*******************************************************
 * CHANGE ENTRY / EXIT
 *******************************************************/
function setMode(mode) {

  currentMode = mode;


  document
    .getElementById('entryBtn')
    .classList.toggle(
      'active',
      mode === 'ENTRY'
    );


  document
    .getElementById('exitBtn')
    .classList.toggle(
      'active',
      mode === 'EXIT'
    );


  /*
   * Restart scanner when mode changes.
   */

  if (scannerRunning) {

    stopScanner()
      .then(function() {

        startScanner();

      });

  } else {

    startScanner();

  }

}


/*******************************************************
 * START CAMERA
 *******************************************************/
function startScanner() {

  clearError();

  hideResult();

  processingScan = false;


  if (!scanner) {

    scanner =
      new Html5Qrcode(
        'reader'
      );
  }


  scanner
    .start(

      {
        facingMode: 'environment'
      },

      {
        fps: 10,

        qrbox: function(
          width,
          height
        ) {

          const size =
            Math.min(
              width,
              height
            ) * 0.70;

          return {
            width: size,
            height: size
          };

        }

      },

      onScanSuccess,

      onScanFailure

    )
    .then(function() {

      scannerRunning = true;

    })
    .catch(function(error) {

      scannerRunning = false;

      showError(
        'Camera error: ' +
        error
      );

    });

}


/*******************************************************
 * QR SCAN SUCCESS
 *******************************************************/
function onScanSuccess(
  decodedText,
  decodedResult
) {

  /*
   * Prevent multiple reads of
   * the same QR while processing.
   */

  if (processingScan) {
    return;
  }


  processingScan = true;


  const studentId =
    extractStudentId(
      decodedText
    );


  if (!studentId) {

    processingScan = false;

    showInvalid();

    return;
  }


  stopScanner()
    .then(function() {

      checkStudent(
        studentId
      );

    });

}


/*******************************************************
 * QR SCAN FAILURE
 *******************************************************/
function onScanFailure(error) {

  /*
   * Ignore normal QR detection failures.
   */
}


/*******************************************************
 * EXTRACT STUDENT ID
 *******************************************************/
function extractStudentId(text) {

  let value =
    String(text || '')
      .trim();


  /*
   * If QR contains only:
   *
   * TNHS-0001
   *
   * return it directly.
   */

  if (
    /^TNHS-/i.test(value)
  ) {

    return value;
  }


  /*
   * If QR contains a URL such as:
   *
   * https://...studentId=TNHS-0001
   *
   * try to get studentId.
   */

  try {

    const url =
      new URL(value);


    const id =
      url.searchParams.get(
        'studentId'
      );


    if (id) {

      return id.trim();
    }

  } catch (error) {

    /*
     * Not a URL.
     */
  }


  /*
   * If QR has extra text,
   * try to locate TNHS-xxxx.
   */

  const match =
    value.match(
      /TNHS-[A-Za-z0-9_-]+/i
    );


  if (match) {

    return match[0];
  }


  return '';
}


/*******************************************************
 * CALL APPS SCRIPT
 *******************************************************/
function checkStudent(
  studentId
) {

  showLoading();


  const callbackName =
    'tnhsCallback_' +
    Date.now();


  /*
   * Create JSONP callback.
   */

  window[callbackName] =
    function(data) {

      try {

        processResult(data);

      } finally {

        delete window[
          callbackName
        ];

        const script =
          document.getElementById(
            callbackName
          );

        if (script) {

          script.remove();

        }
      }

    };


  const url =
    APPS_SCRIPT_URL +
    '?api=scan' +
    '&studentId=' +
    encodeURIComponent(
      studentId
    ) +
    '&mode=' +
    encodeURIComponent(
      currentMode
    ) +
    '&callback=' +
    encodeURIComponent(
      callbackName
    );


  const script =
    document.createElement(
      'script'
    );


  script.id =
    callbackName;

  script.src = url;

  script.onerror =
    function() {

      hideLoading();

      showError(
        'Unable to connect to the TNHS server.'
      );

      processingScan = false;
    };


  document
    .body
    .appendChild(script);

}


/*******************************************************
 * PROCESS SERVER RESULT
 *******************************************************/
function processResult(data) {

  hideLoading();


  if (!data) {

    showError(
      'No response from server.'
    );

    processingScan = false;

    return;
  }


  /*
   * INVALID ID
   */

  if (
    data.ok === false &&
    data.type !== 'duplicate'
  ) {

    showInvalid(
      data.message ||
      'INVALID ID - No records found!'
    );

    return;
  }


  /*
   * DUPLICATE SCAN
   */

  if (
    data.type === 'duplicate'
  ) {

    showDuplicate(data);

    return;
  }


  /*
   * VALID STUDENT
   */

  if (
    data.ok === true &&
    data.student
  ) {

    showStudentResult(
      data
    );

    return;
  }


  showError(
    data.message ||
    'Unexpected server response.'
  );

  processingScan = false;
}


/*******************************************************
 * DISPLAY VALID STUDENT
 *******************************************************/
function showStudentResult(
  data
) {

  const student =
    data.student;


  document
    .getElementById(
      'status'
    )
    .className =
      'status valid';


  document
    .getElementById(
      'status'
    )
    .textContent =
      'VALID ID - Record Found';


  document
    .getElementById(
      'studentName'
    )
    .textContent =
      student.name || '';


  document
    .getElementById(
      'studentGrade'
    )
    .textContent =
      student.grade || '';


  document
    .getElementById(
      'studentSection'
    )
    .textContent =
      student.section || '';


  document
    .getElementById(
      'studentLRN'
    )
    .textContent =
      student.lrn || '';


  document
    .getElementById(
      'studentId'
    )
    .textContent =
      student.studentId || '';


  /*
   * PHOTO IS OPTIONAL.
   *
   * If photoUrl works, display it.
   * If blank/broken, scanner still works.
   */

  displayPhoto(
    student.photoUrl
  );


  /*
   * Display remark.
   */

  displayRemark(
    data.remarks
  );


  document
    .getElementById(
      'result'
    )
    .style.display =
      'block';


  processingScan = false;
}


/*******************************************************
 * DISPLAY PHOTO
 *******************************************************/
function displayPhoto(
  photoUrl
) {

  const box =
    document.getElementById(
      'photoBox'
    );


  box.innerHTML =
    'Photo unavailable';


  if (
    !photoUrl ||
    String(photoUrl).trim() === ''
  ) {

    return;
  }


  const img =
    document.createElement(
      'img'
    );


  img.src =
    String(photoUrl).trim();


  img.alt =
    'Student Photo';


  img.onload =
    function() {

      box.innerHTML = '';

      box.appendChild(img);

    };


  img.onerror =
    function() {

      box.innerHTML =
        'Photo unavailable';

    };

}


/*******************************************************
 * DISPLAY REMARK
 *******************************************************/
function displayRemark(
  remarks
) {

  const element =
    document.getElementById(
      'remark'
    );


  const value =
    String(
      remarks || ''
    );


  element.textContent =
    value;


  element.className =
    'remark';


  /*
   * ENTRY ON TIME
   */

  if (
    value === 'ON TIME'
  ) {

    element.classList.add(
      'green'
    );

    return;
  }


  /*
   * LATE
   */

  if (
    value ===
      'LATE-Needs Gate Pass'
  ) {

    element.classList.add(
      'red'
    );

    return;
  }


  /*
   * EARLY EXIT
   */

  if (
    value ===
      'NEED GATEPASS'
  ) {

    element.classList.add(
      'red'
    );

    return;
  }


  /*
   * NORMAL EXIT
   */

  element.classList.add(
    'blue'
  );
}


/*******************************************************
 * INVALID DISPLAY
 *******************************************************/
function showInvalid(
  message
) {

  hideLoading();

  hideScannerArea();


  const status =
    document.getElementById(
      'status'
    );


  status.className =
    'status invalid';


  status.textContent =
    message ||
    'INVALID ID - No records found!';


  document
    .getElementById(
      'photoBox'
    )
    .innerHTML =
      'No student record';


  document
    .getElementById(
      'studentName'
    )
    .textContent = '';


  document
    .getElementById(
      'studentGrade'
    )
    .textContent = '';


  document
    .getElementById(
      'studentSection'
    )
    .textContent = '';


  document
    .getElementById(
      'studentLRN'
    )
    .textContent = '';


  document
    .getElementById(
      'studentId'
    )
    .textContent = '';


  const remark =
    document.getElementById(
      'remark'
    );


  remark.className =
    'remark red';


  remark.textContent =
    'INVALID ID';


  document
    .getElementById(
      'result'
    )
    .style.display =
      'block';


  processingScan = false;
}


/*******************************************************
 * DUPLICATE DISPLAY
 *******************************************************/
function showDuplicate(
  data
) {

  hideLoading();

  hideScannerArea();


  const status =
    document.getElementById(
      'status'
    );


  status.className =
    'status warning';


  status.textContent =
    'ALREADY SCANNED';


  const student =
    data.student;


  if (student) {

    document
      .getElementById(
        'studentName'
      )
      .textContent =
        student.name || '';


    document
      .getElementById(
        'studentGrade'
      )
      .textContent =
        student.grade || '';


    document
      .getElementById(
        'studentSection'
      )
      .textContent =
        student.section || '';


    document
      .getElementById(
        'studentLRN'
      )
      .textContent =
        student.lrn || '';


    document
      .getElementById(
        'studentId'
      )
      .textContent =
        student.studentId || '';


    displayPhoto(
      student.photoUrl
    );
  }


  const remark =
    document.getElementById(
      'remark'
    );


  remark.className =
    'remark red';


  remark.textContent =
    data.remarks ||
    'Already scanned today.';


  document
    .getElementById(
      'result'
    )
    .style.display =
      'block';


  processingScan = false;
}


/*******************************************************
 * SCAN NEXT
 *******************************************************/
function scanNext() {

  hideResult();

  clearError();

  processingScan = false;

  showScannerArea();

  startScanner();

}


/*******************************************************
 * STOP SCANNER
 *******************************************************/
function stopScanner() {

  if (
    scanner &&
    scannerRunning
  ) {

    return scanner
      .stop()
      .then(function() {

        scannerRunning = false;

      })
      .catch(function() {

        scannerRunning = false;

      });

  }


  return Promise.resolve();
}


/*******************************************************
 * SHOW / HIDE
 *******************************************************/
function hideResult() {

  document
    .getElementById(
      'result'
    )
    .style.display =
      'none';

}


function showScannerArea() {

  document
    .getElementById(
      'scannerArea'
    )
    .style.display =
      'block';

}


function hideScannerArea() {

  document
    .getElementById(
      'scannerArea'
    )
    .style.display =
      'none';

}


function showLoading() {

  document
    .getElementById(
      'loading'
    )
    .style.display =
      'block';

}


function hideLoading() {

  document
    .getElementById(
      'loading'
    )
    .style.display =
      'none';

}


/*******************************************************
 * ERROR
 *******************************************************/
function showError(
  message
) {

  document
    .getElementById(
      'errorMessage'
    )
    .textContent =
      message || '';

}


function clearError() {

  document
    .getElementById(
      'errorMessage'
    )
    .textContent =
      '';

}

</script>

</body>

</html>
